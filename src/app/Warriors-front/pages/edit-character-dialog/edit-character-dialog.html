<form [formGroup]="form" class="flex flex-col gap-4 p-2">

  <!-- NOMBRE -->
  <input pInputText formControlName="name" />

  <!-- KI -->
  <p-inputNumber formControlName="ki" [min]="0"></p-inputNumber>

  <!-- FACCIÓN -->
  <p-select 
    [options]="factions"
    formControlName="faction">
  </p-select>

  <!-- FECHA -->
  <p-datepicker formControlName="date"
  appendTo="body"
  [showIcon]="true"
  dateFormat="dd/mm/yy">
  </p-datepicker>

  <!-- BOTONES -->
  <div class="flex justify-end gap-2">
    <button pButton label="Cancelar" (click)="ref.close()"></button>
    <button pButton label="Guardar" (click)="save()"></button>
  </div>
</form>

<p-toast></p-toast>
